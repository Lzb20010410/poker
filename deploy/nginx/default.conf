# 静态托管 + `/ws` 反代（HTTP 版：拿到证书之前就能用）
#
# 这份文件由 Dockerfile.web 单文件挂进 /etc/nginx/conf.d/default.conf。
# 启用 HTTPS 时换成同目录的 https.conf，步骤见 README「部署」一节。
#
# 为什么前端只需要这一份配置：bundle 里烧的是同源前缀 `/ws`（D-043），
# 所以换域名、从 http 升到 https 都不用重新构建前端。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx 官方镜像默认只压缩 text/html（gzip_types 是注释掉的），
    # 而这个包最大的一块就是 js。不写这段等于把 1.1MB 原样发出去。
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt http-01 校验用。证书签发前这个目录是空的，404 无妨
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 带内容 hash 的产物可以放心永久缓存；index.html 必须永远回源，
    # 否则前端发新版后老链接会一直拿旧 bundle
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 前端是 BrowserRouter（`/r/配对码`、`/t/配对码`），
    # 朋友在微信里直接点分享链接时磁盘上并没有那个文件，必须回落到 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Colyseus 两类请求都从这一条走：
    #   POST /ws/matchmake/{create|join|joinById}/poker  → 服务端
    #   WS   /ws/{processId}/{roomId}                    → 服务端
    # 结尾那个斜杠是关键：`proxy_pass http://server:2567/;` 会剥掉 `/ws` 前缀，
    # 服务端因此不用知道自己被挂在子路径下（`publicAddress` 也就不用配）。
    # server 这个名字由 compose 的服务名解析。
    location /ws/ {
        # 同源校验。**这道门只能放在 nginx**：Colyseus 先把 /matchmake 路由挂好，
        # 才调用我们传进去的 express 回调，所以服务端内部的 origin 中间件够不到 /matchmake
        # （实测：带恶意 Origin 的 POST /matchmake/create/poker 照样建了房，见 D-043）。
        # 比较对象写成「回答这个请求的 host」，于是域名、IP、端口、http/https 全都不用写死。
        set $same_origin "$scheme://$http_host";
        if ($http_origin = $same_origin) {
            set $same_origin same-origin;
        }
        # 没带 Origin 的请求照常放行：健康检查、curl、服务端对服务端调用都不带这个头
        if ($http_origin = "") {
            set $same_origin same-origin;
        }
        if ($same_origin !~ ^same-origin$) {
            return 403;
        }

        proxy_pass http://server:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s：一局牌里没人动的时候是真的会静默这么久以上，
        # 超时会把 WebSocket 掐掉，玩家看到的是「莫名其妙掉线」
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 反代下关掉缓冲，否则 WS 帧会被攒着发
        proxy_buffering off;
    }
}
