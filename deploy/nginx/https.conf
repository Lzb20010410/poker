# 静态托管 + `/ws` 反代（HTTPS 版）
#
# 拿到证书之前不用管这份文件。启用步骤见 README「部署 · 第 3 步」：
# 把下面的 `poker.example.com` 换成你的域名（共 4 处），然后在 compose 里
# 把挂载源从 `default.conf` 改成 `https.conf`。
#
# 为什么必须走 HTTPS：浏览器在 https 页面里会直接拒掉 `ws://`（mixed content），
# 所以「手机 4G 打一局」这条验收的前提就是这里要配对证书。

server {
    listen 80;
    server_name poker.example.com;

    # 证书续期走 http-01，80 不能整个 301 掉
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name poker.example.com;

    ssl_certificate     /etc/letsencrypt/live/poker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 与 default.conf 里那段是同一份内容的两份拷贝。改这里就必须同时改那边——
    # 两张网关心智上不该有差别，但目前没有任何一处会自动同步它们，所以注释写在这。
    location /ws/ {
        # 同源校验。放 nginx 而不是服务端，理由见 default.conf 里那段注释（D-043）。
        # TLS 在这里终结，所以 $scheme 就是 https，和浏览器带的 Origin 对得上。
        set $same_origin "$scheme://$http_host";
        if ($http_origin = $same_origin) {
            set $same_origin same-origin;
        }
        if ($http_origin = "") {
            set $same_origin same-origin;
        }
        if ($same_origin !~ ^same-origin$) {
            return 403;
        }

        proxy_pass http://server:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
