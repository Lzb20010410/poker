# 私局德州扑克 —— 单台 VPS 的两个容器（SPEC §5.1）。
#
# 起停：
#   docker compose up -d --build     构建并起
#   docker compose logs -f server    看服务端 JSON 日志
#   docker compose down              停
#
# 环境变量放同目录 `.env`（照 `.env.example` 抄一份）。compose 会自动读它。

name: poker-room

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    # tsx 会再起一个 node 子进程，没有 init 的话容器收不到 SIGTERM，
    # `docker compose stop` 只能等 10 秒后强杀
    init: true
    environment:
      NODE_ENV: production
      PORT: "2567"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 空值 = 不限制来源（开发便利）。上线填公网 origin，逗号分隔多个
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    # 故意不写 ports：服务端只该被 web 容器通过内部网络访问，
    # 公网机器上 2567 不监听，ws:// 就没有绕过 nginx 的入口。
    expose:
      - "2567"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # 同源前缀。写死在这里而不是从 .env 读：换域名不需要重新构建，
        # 这个值也不该被人填成带域名的绝对地址（D-043）
        VITE_SERVER_URL: /ws
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      # 健康检查写在 Dockerfile.server 里，compose 会读同一份定义
      server:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      # 启用 HTTPS 时把下一行的注释去掉（覆盖镜像里那份 HTTP 配置），
      # 并先把 https.conf 里的域名和证书路径换成你自己的
      # - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro

  # 只在签发/续期时用，不参与 up：
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d 你的域名 --email 你的邮箱 --agree-tos -n
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    profiles:
      - tls

volumes:
  letsencrypt:
  certbot-webroot:
